<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="/styles/main.css">
    <script defer src="/scripts/window.js"></script>
    <script defer src="/scripts/window-element.js"></script>
    <script defer src="/scripts/desktop-icon.js"></script>
    <script src="/scripts/drag.js"></script>
    <meta charset="UTF-8">
  </head>
  <body>
    <div class="col">
      <div id="desktop">
        <window-elmt id="welcome" title="welcome.md &ndash; NotePad" icon="https://cdn.jsdelivr.net/gh/React95/React95@master/packages/icons/png/HelpBook_16x16_4.png">
          <p>
            Haii :3 <br>  
            Welcome to my website, I hope you enjoy your stay!
          </p>
        </window-elmt>
        <window-elmt id="abtme" title="about-me.md &ndash; NotePad" icon="https://cdn.jsdelivr.net/gh/React95/React95@master/packages/icons/png/Mshtml32536_16x16_4.png">
          <p>
            ill do it later
          </p>
        </window-elmt>
        <window-elmt id="window3" title="testing">
          <p>
            im so good at sample text waow!
          </p>
        </window-elmt>

        <div id="desktop-icons">
          <desktop-icon src="https://cdn.jsdelivr.net/gh/alexh/vintage-icons@main/static/icons/help_book_big_0.png" text="welcome.md" action="openWindow('welcome')"></desktop-icon>
          <desktop-icon src="https://cdn.jsdelivr.net/gh/React95/React95@master/packages/icons/png/Mshtml32536_32x32_4.png" text="about-me.md" action="openWindow('abtme')"></desktop-icon>
        </div>

        <div id="wallpaper-container" style="overflow:hidden;">
          <img id="wallpaper" src="/images/cherr.png">
        </div>
      </div>
      <div id="taskbar" class="row">
        START
      </div>

    </div>

    <script>
      const wallpaper = document.getElementById("wallpaper");
      const wallpaper_container = document.getElementById("wallpaper-container");
      const desktop = document.getElementById("desktop");
      wallpaper.setAttribute("width", desktop.getBoundingClientRect().width);
      wallpaper_container.style.height = `${window.innerHeight - document.getElementById("taskbar").getBoundingClientRect().height}px`;
    </script>
  </body>
</html>
