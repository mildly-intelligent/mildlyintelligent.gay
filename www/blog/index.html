<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/blog.css">
    <title>~/blog.sh</title>
    <script defer src="/scripts/emojis.js"></script>
  </head>
  <body>
    <div id="terminal-wrapper">
      <div id="terminal">
        <div class="stdout">
          Welcome to MASH (Maya's Super Awesome Shell)!!<br>
          <i>(It's just a blog)</i><br>
          Type <b>help</b> for instructions<br>
          <i>(or type <b>ls -l</b> and click on whatever post you'd like)</i>
        </div>
      </div>
      <div class="row" id="inputline">
        <span class="powerline symbol">[</span>
        <span class="powerline username">maya</span>
        <span class="powerline symbol">@</span>
        <span class="powerline hostname">mildlyintelligent.gay</span>
        <span class="powerline symbol">in</span>
        <span class="powerline location">~/Documents/</span>
        <div><span class="powerline symbol">]</span> <span class="powerline dollarsign">$</span></div>
        <input type="text" id="terminalinput" autofocus ><br>
      </div>
    </div>
    <div id="blog-wrapper" hidden>
      <pre id="blog-header"></pre>
      <div id="content-wrapper"></div>
    </div>

    <script src="/blog/blog.js"></script>
    <script src="/blog/terminal.js"></script>
  </body>
</html>
