<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="/www/styles/main.css">
    <script defer src="/www/scripts/window.js"></script>
    <script defer src="/www/scripts/window-element.js"></script>
    <script src="/www/scripts/drag.js"></script>
    <meta charset="UTF-8">
  </head>
  <body>
    <div class="col">
      <div id="desktop">
        <window-elmt id="window1" title="welcome.md &ndash; NotePad">
          <p>
            Haii :3 <br>  
            Welcome to my website, I hope you enjoy your stay!
          </p>
        </window-elmt>
        <window-elmt id="window2" title="about-me.md &ndash; NotePad">
          <p>
            ill do it later
          </p>
        </window-elmt>


        <div id="wallpaper-container" style="overflow:hidden;">
          <img id="wallpaper" src="/www/images/cherr.png">
        </div>
      </div>
      <div id="taskbar" class="row">
        START
      </div>

    </div>

    <script>
      const wallpaper = document.getElementById("wallpaper");
      const wallpaper_container = document.getElementById("wallpaper-container");
      const desktop = document.getElementById("desktop");
      wallpaper.setAttribute("width", desktop.getBoundingClientRect().width);
      wallpaper_container.style.height = `${window.innerHeight - document.getElementById("taskbar").getBoundingClientRect().height}px`;
    </script>
  </body>
</html>
